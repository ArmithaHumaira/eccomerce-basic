<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-white">

  <div class="flex flex-col md:flex-row items-center justify-center max-w-5xl w-full p-6">
    
    <!-- Ilustrasi -->
    <div class="container mx-auto flex flex-col lg:flex-row items-center lg:items-start lg:justify-center lg:space-x-10">
      <!-- Left Section (Image Placeholder) -->
      <div class="hidden lg:block w-1/2">
        <div class="h-full rounded-md flex items-center justify-center">
          <img src="../img/online-shopping-13-61aac 1.png" alt="Promo" class="w-full h-auto object-cover" />
        </div>
      </div>

    <!-- Form Login -->
    <div class="md:w-1/2 w-full max-w-md space-y-6">
      <h2 class="text-3xl font-bold">Login</h2>
      <p class="text-sm text-gray-600">
        Don’t have an account? 
        <a href="register.html" class="text-green-500 hover:underline">Sign up here</a>
      </p>

      <form class="space-y-4" action="home.html" method="GET">
        <input
          type="email"
          name="email"
          placeholder="Email address"
          required
          class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-green-300"
        />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
          class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-green-300"
        />
        <button
          type="submit"
          class="w-full bg-blue-100 text-gray-800 px-4 py-2 rounded hover:bg-blue-200 transition"
        >
          Login
        </button>
      </form>
      

      <div class="text-center">
        <a href="#" class="text-xs text-gray-500 hover:underline">Forgot Password?</a>
      </div>

      <!-- Login with social -->
      <div class="flex justify-center space-x-4 pt-2">
        <button class="border px-3 py-2 rounded-full hover:bg-gray-100">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
        </button>
        <button class="border px-3 py-2 rounded-full hover:bg-gray-100">
          <img src="../img/Vector.png" alt="Facebook" class="w-3 h-4">
        </button>
      </div>
    </div>
  </div>


<!--js data login untuk profile-->
  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();
    
      // Validasi sederhana
      if (!email || !password) return alert("Email & password wajib diisi.");
    
      // Simulasi data user (seharusnya dari server)
      const userData = {
        username: email.split("@")[0],
        name: "Balerina lala",
        phone: "+62 89078-3460-1220",
        email,
        address: "Jl. Melati, Blok c4, simpang raya"
      };
    
      localStorage.setItem("user", JSON.stringify(userData));
      window.location.href = "home.html";
    });
    </script>



</body>
</html>
